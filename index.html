<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevWorkspace Studio</title>
  
  <!-- CodeMirror CSS & Themes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #1e1e1e; color: #d4d4d4; height: 100vh; overflow: hidden; }

    /* Login Screen */
    #login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; background: #121212; }
    .auth-card { background: #252526; padding: 32px; border-radius: 8px; width: 340px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #333; }
    .auth-card h2 { margin-bottom: 20px; color: #fff; text-align: center; }
    .auth-card input { width: 100%; padding: 10px; margin-bottom: 12px; background: #1e1e1e; border: 1px solid #3c3c3c; color: white; border-radius: 4px; outline: none; }
    .auth-card input:focus { border-color: #0e639c; }
    .auth-card button { width: 100%; padding: 10px; background: #0e639c; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 8px; }
    .auth-card button:hover { background: #1177bb; }
    .auth-toggle { text-align: center; font-size: 0.85rem; color: #a0a0a0; cursor: pointer; margin-top: 8px; }
    .auth-toggle:hover { color: #fff; text-decoration: underline; }

    /* Workspace */
    #workspace { display: none; flex-direction: column; height: 100vh; }
    
    /* Topbar */
    #topbar { height: 45px; background: #2d2d2d; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #1e1e1e; }
    .project-controls { display: flex; align-items: center; gap: 10px; }
    select, button { background: #3c3c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    select { outline: none; background: #1e1e1e; border: 1px solid #3c3c3c; }
    button.primary { background: #0e639c; }
    button.primary:hover { background: #1177bb; }
    button.success { background: #28a745; }
    button.success:hover { background: #218838; }
    button.danger { background: #9c0e0e; }
    button.danger:hover { background: #bb1111; }
    
    .user-info { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; }

    /* Main Container */
    #main-container { flex: 1; display: flex; overflow: hidden; position: relative; }

    /* Sidebar */
    #sidebar { width: 220px; background: #252526; border-right: 1px solid #333; display: flex; flex-direction: column; }
    .sidebar-header { padding: 12px 16px; font-weight: bold; font-size: 0.85rem; text-transform: uppercase; color: #888; border-bottom: 1px solid #333; }
    
    #file-list { flex: 1; overflow-y: auto; list-style: none; padding: 8px 0; }
    .file-item { padding: 8px 16px; cursor: pointer; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
    .file-item:hover { background: #2a2d2e; }
    .file-item.active { background: #37373d; color: #fff; font-weight: bold; border-left: 3px solid #0e639c; }
    .delete-file-btn { color: #888; font-size: 0.8rem; display: none; }
    .file-item:hover .delete-file-btn { display: inline; }
    .delete-file-btn:hover { color: #ff5555; }

    .sidebar-actions { padding: 12px; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 8px; }

    /* Editor Section */
    #editor-section { flex: 1; display: flex; flex-direction: column; background: #282a36; border-right: 1px solid #333; }
    #tab-bar { height: 35px; background: #1e1e1e; display: flex; align-items: center; padding: 0 16px; font-size: 0.85rem; color: #aaa; border-bottom: 1px solid #282a36; }
    .CodeMirror { height: 100% !important; flex: 1; font-family: 'Consolas', 'Fira Code', monospace; font-size: 14px; }

    /* Preview Section */
    #preview-section { flex: 1; display: flex; flex-direction: column; background: #ffffff; }
    #preview-header { height: 35px; background: #252526; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; color: #aaa; font-size: 0.85rem; border-bottom: 1px solid #333; }
    #preview-frame { flex: 1; width: 100%; border: none; background: #fff; }
  </style>
</head>
<body>

  <!-- 1. LOGIN / REGISTER SCREEN -->
  <div id="login-screen">
    <div class="auth-card">
      <h2 id="auth-title">Login</h2>
      <form id="auth-form" onsubmit="handleAuth(event)">
        <input type="text" id="username" placeholder="Username" required autocomplete="username">
        <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
        <button type="submit" id="auth-btn" class="primary">Sign In</button>
      </form>
      <div class="auth-toggle" onclick="toggleAuthMode()" id="auth-toggle-btn">Need an account? Register</div>
    </div>
  </div>

  <!-- 2. MAIN WORKSPACE -->
  <div id="workspace">
    <!-- Topbar -->
    <div id="topbar">
      <div class="project-controls">
        <label for="project-select" style="font-size: 0.85rem; color: #aaa;">Project:</label>
        <select id="project-select" onchange="switchProject(this.value)"></select>
        <button class="primary" onclick="createNewProject()">+ New Project</button>
        <button class="danger" onclick="deleteCurrentProject()">Delete Project</button>
      </div>

      <div class="user-info">
        <button class="success" onclick="updateLivePreview()">Run / Refresh Preview</button>
        <span id="user-display"></span>
        <button onclick="logout()">Logout</button>
      </div>
    </div>

    <!-- Main Workspace Area -->
    <div id="main-container">
      <!-- Sidebar -->
      <div id="sidebar">
        <div class="sidebar-header">Files</div>
        <ul id="file-list"></ul>
        <div class="sidebar-actions">
          <button onclick="createNewFile()">+ New File</button>
          <button class="primary" onclick="exportToFolder()">Export Folder</button>
        </div>
      </div>

      <!-- Code Editor -->
      <div id="editor-section">
        <div id="tab-bar">No file open</div>
        <textarea id="editor"></textarea>
      </div>

      <!-- Live Preview -->
      <div id="preview-section">
        <div id="preview-header">
          <span>Live Preview</span>
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" id="auto-preview" checked> Auto-Refresh
          </label>
        </div>
        <iframe id="preview-frame" sandbox="allow-scripts allow-modals"></iframe>
      </div>
    </div>
  </div>

  <!-- CodeMirror JavaScript Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/markdown/markdown.min.js"></script>

  <script>
    const ALLOWED_EXTENSIONS = ['.html', '.css', '.js', '.md', '.txt'];
    let isRegisterMode = false;
    let currentUser = null;
    let projects = [];
    let activeProjectId = null;
    let activeFileName = null;
    let editor = null;
    let autoRefreshTimer = null;

    // --- Authentication ---
    function initAuth() {
      const sessionUser = sessionStorage.getItem('devworkspace_user');
      if (sessionUser) {
        currentUser = sessionUser;
        showWorkspace();
      }
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-title').textContent = isRegisterMode ? 'Register' : 'Login';
      document.getElementById('auth-btn').textContent = isRegisterMode ? 'Sign Up' : 'Sign In';
      document.getElementById('auth-toggle-btn').textContent = isRegisterMode ? 'Already have an account? Login' : 'Need an account? Register';
    }

    function handleAuth(e) {
      e.preventDefault();
      const userVal = document.getElementById('username').value.trim();
      const passVal = document.getElementById('password').value.trim();
      if (!userVal || !passVal) return;

      const users = JSON.parse(localStorage.getItem('devworkspace_users') || '{}');

      if (isRegisterMode) {
        if (users[userVal]) {
          alert('Username already exists.');
          return;
        }
        users[userVal] = passVal;
        localStorage.setItem('devworkspace_users', JSON.stringify(users));
        alert('Account created! Logging in...');
      } else {
        if (!users[userVal] || users[userVal] !== passVal) {
          alert('Invalid credentials.');
          return;
        }
      }

      currentUser = userVal;
      sessionStorage.setItem('devworkspace_user', currentUser);
      showWorkspace();
    }

    function logout() {
      sessionStorage.removeItem('devworkspace_user');
      location.reload();
    }

    // --- Workspace & CodeMirror ---
    function showWorkspace() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('workspace').style.display = 'flex';
      document.getElementById('user-display').textContent = `User: ${currentUser}`;

      if (!editor) {
        editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
          lineNumbers: true,
          theme: 'dracula',
          mode: 'htmlmixed',
          tabSize: 2,
          lineWrapping: true
        });

        editor.on('change', () => {
          if (activeProjectId && activeFileName) {
            const project = projects.find(p => p.id === activeProjectId);
            if (project && project.files[activeFileName] !== undefined) {
              project.files[activeFileName] = editor.getValue();
              saveProjectsToStorage();

              if (document.getElementById('auto-preview').checked) {
                clearTimeout(autoRefreshTimer);
                autoRefreshTimer = setTimeout(updateLivePreview, 500);
              }
            }
          }
        });
      }

      loadProjects();
    }

    // --- Projects Management ---
    function loadProjects() {
      const stored = localStorage.getItem(`devworkspace_projects_${currentUser}`);
      if (stored) {
        projects = JSON.parse(stored);
      } else {
        projects = [{
          id: 'proj_' + Date.now(),
          name: 'Interactive Web App',
          files: {
            'index.html': '<!DOCTYPE html>\n<html>\n<head>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1>Live Preview Active</h1>\n  <p>Edit this code to see updates real-time.</p>\n  <button id="btn">Click Me</button>\n  <script src="script.js"><\/script>\n</body>\n</html>',
            'style.css': 'body {\n  font-family: sans-serif;\n  background: #f4f4f9;\n  color: #333;\n  padding: 20px;\n}\nbutton {\n  padding: 8px 16px;\n  background: #0e639c;\n  color: white;\n  border: none;\n  border-radius: 4px;\n  cursor: pointer;\n}',
            'script.js': 'document.getElementById("btn").addEventListener("click", () => {\n  alert("Button clicked!");\n});',
            'notes.md': '# Project Overview'
          }
        }];
        saveProjectsToStorage();
      }

      renderProjectDropdown();
      if (projects.length > 0) switchProject(projects[0].id);
    }

    function saveProjectsToStorage() {
      localStorage.setItem(`devworkspace_projects_${currentUser}`, JSON.stringify(projects));
    }

    function renderProjectDropdown() {
      const select = document.getElementById('project-select');
      select.innerHTML = '';
      projects.forEach(p => {
        const option = document.createElement('option');
        option.value = p.id;
        option.textContent = p.name;
        select.appendChild(option);
      });
      select.value = activeProjectId;
    }

    function switchProject(projectId) {
      activeProjectId = projectId;
      renderProjectDropdown();
      renderFileList();

      const project = projects.find(p => p.id === activeProjectId);
      const filenames = Object.keys(project.files);
      if (filenames.length > 0) {
        selectFile(filenames[0]);
      } else {
        activeFileName = null;
        document.getElementById('tab-bar').textContent = 'No file selected';
        editor.setValue('');
      }
      updateLivePreview();
    }

    function createNewProject() {
      const name = prompt('Enter Project Name:');
      if (!name) return;

      const newProj = {
        id: 'proj_' + Date.now(),
        name: name,
        files: {
          'index.html': '<!DOCTYPE html>\n<html>\n<body>\n  <h1>' + name + '</h1>\n</body>\n</html>'
        }
      };
      projects.push(newProj);
      saveProjectsToStorage();
      switchProject(newProj.id);
    }

    function deleteCurrentProject() {
      if (projects.length <= 1) {
        alert('You must keep at least one project.');
        return;
      }
      if (confirm('Are you sure you want to delete this project?')) {
        projects = projects.filter(p => p.id !== activeProjectId);
        saveProjectsToStorage();
        switchProject(projects[0].id);
      }
    }

    // --- File Operations ---
    function getSyntaxMode(filename) {
      if (filename.endsWith('.html')) return 'htmlmixed';
      if (filename.endsWith('.css')) return 'css';
      if (filename.endsWith('.js')) return 'javascript';
      if (filename.endsWith('.md')) return 'markdown';
      return 'text/plain';
    }

    function renderFileList() {
      const listEl = document.getElementById('file-list');
      listEl.innerHTML = '';
      const project = projects.find(p => p.id === activeProjectId);
      if (!project) return;

      Object.keys(project.files).forEach(filename => {
        const li = document.createElement('li');
        li.className = `file-item ${filename === activeFileName ? 'active' : ''}`;
        
        const span = document.createElement('span');
        span.textContent = filename;
        span.onclick = () => selectFile(filename);

        const delBtn = document.createElement('span');
        delBtn.className = 'delete-file-btn';
        delBtn.innerHTML = '&#10005;';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteFile(filename);
        };

        li.appendChild(span);
        li.appendChild(delBtn);
        listEl.appendChild(li);
      });
    }

    function selectFile(filename) {
      activeFileName = filename;
      const project = projects.find(p => p.id === activeProjectId);
      const content = project.files[filename] || '';

      document.getElementById('tab-bar').textContent = filename;
      editor.setOption('mode', getSyntaxMode(filename));
      editor.setValue(content);
      renderFileList();
    }

    function createNewFile() {
      const filename = prompt('Enter filename (.html, .css, .js, .md, .txt):');
      if (!filename) return;

      const isValid = ALLOWED_EXTENSIONS.some(ext => filename.endsWith(ext));
      if (!isValid) {
        alert(`Invalid file extension. Supported: ${ALLOWED_EXTENSIONS.join(', ')}`);
        return;
      }

      const project = projects.find(p => p.id === activeProjectId);
      if (project.files[filename] !== undefined) {
        alert('File already exists.');
        return;
      }

      project.files[filename] = '';
      saveProjectsToStorage();
      selectFile(filename);
    }

    function deleteFile(filename) {
      if (confirm(`Delete ${filename}?`)) {
        const project = projects.find(p => p.id === activeProjectId);
        delete project.files[filename];
        saveProjectsToStorage();

        const remaining = Object.keys(project.files);
        if (remaining.length > 0) {
          selectFile(remaining[0]);
        } else {
          activeFileName = null;
          document.getElementById('tab-bar').textContent = 'No file open';
          editor.setValue('');
          renderFileList();
        }
        updateLivePreview();
      }
    }

    // --- Live Preview Engine ---
    function updateLivePreview() {
      const project = projects.find(p => p.id === activeProjectId);
      if (!project) return;

      let html = project.files['index.html'] || '<html><body>No index.html found.</body></html>';

      // Inline CSS link tag replacements
      html = html.replace(/<link\s+rel=["']stylesheet["']\s+href=["']([^"']+)["']\s*\/?>/gi, (match, src) => {
        if (project.files[src] !== undefined) {
          return `<style>\n${project.files[src]}\n</style>`;
        }
        return match;
      });

      // Inline JS script tag replacements
      html = html.replace(/<script\s+src=["']([^"']+)["']\s*><\/script>/gi, (match, src) => {
        if (project.files[src] !== undefined) {
          return `<script>\n${project.files[src]}\n<\/script>`;
        }
        return match;
      });

      const frame = document.getElementById('preview-frame');
      frame.srcdoc = html;
    }

    // --- Folder Export ---
    async function exportToFolder() {
      const project = projects.find(p => p.id === activeProjectId);
      const fileNames = Object.keys(project.files);

      if (fileNames.length === 0) {
        alert('No files to export.');
        return;
      }

      if (!('showDirectoryPicker' in window)) {
        alert('Folder exporting requires Chrome, Edge, or Opera using the File System Access API.');
        return;
      }

      try {
        const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });

        for (const filename of fileNames) {
          const content = project.files[filename];
          const fileHandle = await dirHandle.getFileHandle(filename, { create: true });
          const writable = await fileHandle.createWritable();
          await writable.write(content);
          await writable.close();
        }

        alert(`Successfully exported project "${project.name}" to folder!`);
      } catch (err) {
        if (err.name !== 'AbortError') {
          console.error('Export failed:', err);
          alert('Exporting folder failed.');
        }
      }
    }

    initAuth();
  </script>
</body>
</html>
